name: Release Tag Verify

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
      - "einoadapter/v*.*.*"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # 校验全部通过后，仅为已推送标签创建 GitHub Release。

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史以校验 tag 提交是否在 main 上

      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "tag $GITHUB_REF_NAME (commit $GITHUB_SHA) 未合并到 main，拒绝发布"; exit 1
          fi
          echo "tag commit is on main"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: goinstall

      - name: Verify tag matches module Version constant
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v1.*) FILE="version.go" ;;
            v2.*) FILE="v2/version.go" ;;
            einoadapter/v*)
              version="${TAG#einoadapter/v}"
              grep -Fq "## [$version] - " einoadapter/CHANGELOG.md
              exit 0 ;;
            *) echo "unrecognized tag $TAG"; exit 1 ;;
          esac
          CONST=$(grep -oE 'Version = "v[0-9]+\.[0-9]+\.[0-9]+[^"]*"' "$FILE" | grep -oE 'v[0-9][^"]*')
          if [ "$CONST" != "$TAG" ]; then
            echo "tag $TAG does not match $FILE Version constant $CONST"; exit 1
          fi
          echo "version constant check passed: $TAG"

      - name: Verify root module
        run: |
          go vet ./...
          golangci-lint run ./...
          go test -race -count=1 -timeout=5m ./...
          go test -run '^$' -bench=. -benchmem -count=3 ./...
          go test -coverprofile=coverage.out ./provider
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          awk -v got="$coverage" 'BEGIN { if (got+0 < 80.0) exit 1 }' || { echo "root provider coverage $coverage% < 80%"; exit 1; }
          echo "root provider coverage: $coverage%"

      - name: Verify v2 module
        working-directory: v2
        run: |
          go vet ./...
          golangci-lint run ./...
          go test -race -count=1 -timeout=5m ./...
          go test -run '^$' -bench=. -benchmem -count=3 ./...
          go test -coverprofile=coverage.out ./provider
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          awk -v got="$coverage" 'BEGIN { if (got+0 < 80.0) exit 1 }' || { echo "v2 provider coverage $coverage% < 80%"; exit 1; }
          echo "v2 provider coverage: $coverage%"

      - name: Verify standalone adapter module
        working-directory: einoadapter
        env:
          GOWORK: "off"
        run: |
          go mod tidy -diff
          go mod verify
          go vet ./...
          golangci-lint run ./...
          go test -race -count=1 -timeout=5m ./...
          go test -run '^$' -bench=. -benchmem -count=3 ./...
          go test -coverprofile=coverage.out ./...
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          awk -v got="$coverage" 'BEGIN { if (got+0 < 80.0) exit 1 }' || { echo "adapter coverage $coverage% < 80%"; exit 1; }

      - name: Publish GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 为当前版本补齐 Release 页面；不修改任何已存在的标签或 Release。
          root_tag=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' version.go)
          v2_tag=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' v2/version.go)
          for release_tag in "$root_tag" "$v2_tag" "$GITHUB_REF_NAME"; do
            if gh release view "$release_tag" >/dev/null 2>&1; then
              continue
            fi
            git merge-base --is-ancestor "$release_tag" HEAD
            case "$release_tag" in
              v1.*) git diff --exit-code "$release_tag" HEAD -- go.mod go.sum version.go provider example ;;
              v2.*) git diff --exit-code "$release_tag" HEAD -- v2/go.mod v2/go.sum v2/version.go v2/provider v2/example ;;
            esac
            RELEASE_TAG="$release_tag" python3 - <<'PYNOTES'
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if tag.startswith("einoadapter/"):
              changelog = "einoadapter/CHANGELOG.md"
              version = tag.removeprefix("einoadapter/v")
          elif tag.startswith("v2."):
              changelog = "v2/CHANGELOG.md"
              version = tag.removeprefix("v")
          else:
              changelog = "CHANGELOG.md"
              version = tag.removeprefix("v")
          source = subprocess.check_output(["git", "show", tag + ":" + changelog], text=True)
          match = re.search(r"^## \[v?" + re.escape(version) + r"\] - \d{4}-\d{2}-\d{2}\n(.*?)(?=^## |\Z)", source, re.M | re.S)
          if not match or not match[1].strip():
              raise SystemExit("missing release notes: " + tag)
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(match[1].strip() + "\n")
          PYNOTES
            latest=false
            case "$release_tag" in v2.*) latest=true ;; esac
            gh release create "$release_tag" --verify-tag --title "$release_tag" --notes-file "$RUNNER_TEMP/release-notes.md" --latest="$latest"
          done
