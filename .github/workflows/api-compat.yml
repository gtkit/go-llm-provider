# 导出 API 兼容门禁：同一 module path 内（v1 根模块、v2 子模块）禁止不兼容的导出
# API 变更。按 Go Module 导入兼容规则，不兼容变更只能通过新 major（/vN）发布；相对
# 该模块最新 release tag 检测到不兼容变更即失败，阻止误删导出符号、改签名或改接口
# 方法后仍以 MINOR/PATCH 发布。2026-10-13 用户明确授权的职责精简仅按基线、目标版本
# 和完整差异清单允许一次例外，见 .github/api-compat/README.md。
name: API 兼容门禁

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apidiff:
    name: apidiff（${{ matrix.name }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1 根模块
            dir: .
            pkg: github.com/gtkit/go-llm-provider/provider
            tag_glob: v1.*
            gomod: go.mod
          - name: v2
            dir: v2
            pkg: github.com/gtkit/go-llm-provider/v2/provider
            tag_glob: v2.*
            gomod: v2/go.mod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要全部历史与 tag 以取基线
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.gomod }}
      - name: 安装 apidiff
        # 固定版本：门禁行为需可复现，避免 @latest 漂移导致不同 CI run 结果不一致。
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260709172345-9ea1abe57597
      - name: 计算基线 tag
        id: base
        run: |
          # 只匹配正式版格式 vX.Y.Z，排除预发布 tag（如 v2.7.0-rc.1），以正式版为兼容基线。
          tag=$(git tag --list '${{ matrix.tag_glob }}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$tag" ]; then
            echo "该模块暂无 release tag，跳过 API 比对"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "基线 tag: $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - name: 比对导出 API
        if: steps.base.outputs.skip != 'true'
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/apidiff-base"
          git worktree add --quiet "$base" "${{ steps.base.outputs.tag }}"
          ( cd "$base/${{ matrix.dir }}" && apidiff -w "$RUNNER_TEMP/old.api" "${{ matrix.pkg }}" )
          ( cd "${{ matrix.dir }}" && apidiff -w "$RUNNER_TEMP/new.api" "${{ matrix.pkg }}" )
          echo "== 相对 ${{ steps.base.outputs.tag }} 的全部导出 API 变更 =="
          apidiff "$RUNNER_TEMP/old.api" "$RUNNER_TEMP/new.api"
          apidiff -incompatible "$RUNNER_TEMP/old.api" "$RUNNER_TEMP/new.api" > "$RUNNER_TEMP/incompatible.txt"
          if [ -s "$RUNNER_TEMP/incompatible.txt" ]; then
            version=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' '${{ matrix.dir }}/version.go')
            allowlist=""
            case '${{ steps.base.outputs.tag }}':"$version" in
              v1.10.0:v1.11.0) allowlist=".github/api-compat/v1-pruning.txt" ;;
              v2.17.0:v2.18.0) allowlist=".github/api-compat/v2-pruning.txt" ;;
            esac
            if [ -n "$allowlist" ] && cmp -s "$allowlist" "$RUNNER_TEMP/incompatible.txt"; then
              echo "已匹配用户授权的本次 API 删除例外：${{ steps.base.outputs.tag }} -> $version"
              exit 0
            fi
            echo "::error::检测到未授权的不兼容导出 API 变更"
            cat "$RUNNER_TEMP/incompatible.txt"
            exit 1
          fi
          echo "✅ 无不兼容变更"
