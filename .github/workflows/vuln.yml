# 依赖漏洞定时扫描：govulncheck 独立覆盖三个模块（v1 根、v2、billingstore 示例），
# 各自按其 go.mod 解析依赖。每周一次 + 手动触发；发现受影响的漏洞即失败。
name: 依赖漏洞扫描

on:
  schedule:
    - cron: "17 2 * * 1" # 每周一 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck（${{ matrix.name }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1 根模块
            dir: .
            gomod: go.mod
          - name: v2
            dir: v2
            gomod: v2/go.mod
          - name: billingstore
            dir: v2/example/billingstore
            gomod: v2/example/billingstore/go.mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.gomod }}
      - name: 安装 govulncheck
        # 固定扫描器版本以保证 CI 行为可复现；漏洞库仍在运行时从 vuln.go.dev 拉取最新。
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: 扫描
        working-directory: ${{ matrix.dir }}
        run: govulncheck ./...
